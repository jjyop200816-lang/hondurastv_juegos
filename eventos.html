<script>
    function openAction(target) {
        if (window.Android && typeof window.Android.openStream === 'function') {
            window.Android.openStream(target);
        } else {
            window.location.href = target;
        }
    }

    const jsonUrl = 'https://jjyop200816-lang.github.io/hondurastv_juegos/partidos.json?v=' + new Date().getTime();

    fetch(jsonUrl)
        .then(response => {
            if (!response.ok) throw new Error("No se pudo cargar el archivo partidos.json");
            return response.json();
        })
        .then(eventos => {
            const container = document.getElementById('matches-list');
            container.innerHTML = '';

            eventos.forEach((item, index) => {
                let btnsHtml = '';
                item.opciones.forEach(op => {
                    btnsHtml += `<button class="play-btn" onclick="openAction('${op.stream}')">▶ ${op.nombre}</button>`;
                });

                // Convertimos la hora de inicio a la hora local del dispositivo para mostrarla en pantalla
                const fechaInicio = new Date(item.start);
                const horaLocal = fechaInicio.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true });

                const cardHtml = `
                    <div class="card waiting" id="card-${index}" data-start="${item.start}" data-end="${item.end}">
                        <div class="match-info">
                            <span class="date-time">📅 ${horaLocal}</span>
                            <span class="status-badge badge-wait">PRÓXIMO</span>
                            <span class="status-badge badge-live">EN VIVO</span>
                            <span class="status-badge badge-ended">FINALIZADO</span>
                        </div>
                        <div class="teams">
                            <div class="team">
                                <img src="${item.logo1}" class="flag" alt="${item.equipo1}">
                                <span>${item.equipo1}</span>
                            </div>
                            <div class="vs">VS</div>
                            <div class="team">
                                <img src="${item.logo2}" class="flag" alt="${item.equipo2}">
                                <span>${item.equipo2}</span>
                            </div>
                        </div>
                        <div class="actions">${btnsHtml}</div>
                    </div>
                `;
                container.innerHTML += cardHtml;
            });

            actualizarEstados();
            setInterval(actualizarEstados, 10000);
        })
        .catch(error => {
            console.error(error);
            document.getElementById('matches-list').innerHTML = '<p style="text-align:center; color:#f87171;">Error al cargar partidos.json</p>';
        });

    function actualizarEstados() {
        const ahora = new Date().getTime();

        document.querySelectorAll('.card').forEach((card) => {
            const inicio = new Date(card.getAttribute('data-start')).getTime();
            const fin = new Date(card.getAttribute('data-end')).getTime();

            card.classList.remove('active', 'finished', 'waiting');

            if (ahora < inicio) {
                card.classList.add('waiting');
            } else if (ahora >= inicio && ahora <= fin) {
                card.classList.add('active');
            } else {
                card.classList.add('finished');
            }
        });
    }
</script>

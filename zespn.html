<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reproductor Stream</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      background-color: #000;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .player-container {
      position: relative;
      width: 100%;
      max-width: 1280px;
      aspect-ratio: 16 / 9;
      background: #000;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <div class="player-container">
    <iframe 
      src="https://playvi.org/deportesplus.php" 
      title="Reproductor de Deportes"
      allowfullscreen="true"
      webkitallowfullscreen="true"
      mozallowfullscreen="true"
      scrolling="no"
      /* Permite reproducción con audio y ejecución básica, pero BLOQUEA popups y redirecciones de anuncios */
      allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; gyro; accelerometer"
      sandbox="allow-scripts allow-same-origin allow-forms">
    </iframe>
  </div>

</body>
</html>

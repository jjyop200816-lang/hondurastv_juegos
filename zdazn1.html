<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAZN 1 Spain - Reproductor</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            position: relative;
            width: 100%;
            max-width: 900px;
            aspect-ratio: 16 / 9;
            max-height: 85vh;
            overflow: hidden;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.7);
            background-color: #000;
        }
        .container iframe {
            position: absolute;
            top: -45%; /* Desplazamiento mayor hacia arriba para centrar la transmisión perfectamente */
            left: 0;
            width: 100%;
            height: 200%; 
            border: none;
        }
        /* Ajuste cuando está en pantalla completa */
        .container:fullscreen {
            max-width: 100%;
            max-height: 100%;
            width: 100vw;
            height: 100vh;
            border-radius: 0;
        }
    </style>
</head>
<body>

    <div class="container" id="playerContainer">
        <iframe 
            src="https://zlive.st/embed/dazn-1-spain-backup" 
            sandbox="allow-scripts allow-same-origin allow-presentation allow-autoplay allow-forms"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen"
            allowfullscreen
            loading="lazy">
        </iframe>
    </div>

    <script>
        const container = document.getElementById('playerContainer');
        let lastTap = 0;

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                if (container.requestFullscreen) {
                    container.requestFullscreen();
                } else if (container.webkitRequestFullscreen) {
                    container.webkitRequestFullscreen();
                } else if (container.msRequestFullscreen) {
                    container.msRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // Doble clic sobre el contenedor para pantalla completa
        container.addEventListener('dblclick', function(e) {
            toggleFullscreen();
        });

        // Doble toque rápido en móvil sobre el contenedor
        container.addEventListener('touchend', function(e) {
            const currentTime = new Date().getTime();
            const tapLength = currentTime - lastTap;
            if (tapLength < 300 && tapLength > 0) {
                toggleFullscreen();
                e.preventDefault();
            }
            lastTap = currentTime;
        });
    </script>

</body>
</html>

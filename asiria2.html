<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reproductor Pantalla Completa</title>
  <style>
    /* Elimina márgenes y barras de desplazamiento de la página principal */
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #000;
      overflow: hidden;
    }

    /* Contenedor a pantalla completa que recorta el sobrante */
    .player-container {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* Iframe ajustado para recortar la parte superior */
    .player-container iframe {
      width: 100%;
      height: 130vh; /* Le damos más altura para desplazar la parte superior fuera de vista */
      border: 0;
      margin-top: -15vh; /* Ajuste relativo que desplaza la franja superior hacia arriba */
    }
  </style>
</head>
<body>

  <div class="player-container">
    <iframe 
      src="https://embedindia.st/embed/uefa-nations-league/2026-09-24/srb-gre" 
      sandbox="allow-scripts allow-same-origin allow-forms"
      scrolling="no"
      allowfullscreen="true"
      webkitallowfullscreen="true"
      mozallowfullscreen="true">
    </iframe>
  </div>

</body>
</html>

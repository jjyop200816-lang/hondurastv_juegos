<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liga Nacional</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #0b1120; color: #ffffff; padding: 16px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 480px; }
        .header-main { text-align: center; margin-bottom: 16px; }
        .header-main h1 { font-size: 1.8rem; color: #00c853; text-transform: uppercase; letter-spacing: 1px; }
        .live-global-banner { background: #e11d48; color: white; padding: 10px; border-radius: 8px; text-align: center; font-weight: bold; font-size: 0.95rem; margin-bottom: 20px; display: none; animation: pulse 1.5s infinite; box-shadow: 0 0 12px rgba(225, 29, 72, 0.5); }
        .live-global-banner.show { display: block; }
        .date-group { font-size: 1rem; color: #94a3b8; margin: 18px 0 10px 4px; font-weight: 700; text-transform: capitalize; border-left: 3px solid #00c853; padding-left: 8px; }
        .card { background: #1e293b; border-radius: 14px; padding: 16px; margin-bottom: 12px; border: 1px solid #334155; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3); transition: all 0.3s ease; }
        .card.active { border: 2px solid #00c853; background: linear-gradient(145deg, #1e293b, #092617); box-shadow: 0 0 15px rgba(0, 200, 83, 0.2); }
        .card.finished { opacity: 0.7; }
        .match-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); padding-bottom: 8px; }
        .date-time { font-size: 0.85rem; color: #cbd5e1; font-weight: 600; }
        .status-badge { font-size: 0.7rem; padding: 3px 10px; border-radius: 20px; font-weight: 800; letter-spacing: 0.5px; display: none; }
        .card.waiting .badge-wait { display: inline-block; background-color: #334155; color: #94a3b8; }
        .card.active.is-live .badge-live { display: inline-block; background-color: #e11d48; color: #ffffff; animation: pulse 1.5s infinite; }
        .card.finished .badge-ended { display: inline-block; background-color: #475569; color: #cbd5e1; }
        .teams { display: flex; justify-content: space-between; align-items: center; margin: 12px 0; font-size: 1rem; font-weight: 700; text-align: center; }
        .team { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .vs-container { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 50px; }
        .vs { font-size: 0.85rem; color: #64748b; font-weight: 800; }
        .actions { display: none; justify-content: center; align-items: center; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
        .card.active .actions { display: flex; }
        .card.finished .actions, .card.waiting .actions { display: none !important; }
        .play-btn { height: 40px; padding: 0 14px; border-radius: 20px; background: #00c853; color: white; display: flex; justify-content: center; align-items: center; text-decoration: none; font-size: 12px; font-weight: 800; box-shadow: 0 4px 12px rgba(0, 200, 83, 0.4); border: none; cursor: pointer; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
    </style>
</head>
<body>
<div class="container">
    <div class="header-main"><h1>Liga Nacional</h1></div>
    <div id="liveBanner" class="live-global-banner">🔴 ¡PARTIDOS EN VIVO AHORA MISMO!</div>
    <div id="matchesContainer">Cargando partidos...</div>
</div>
<script>
    const JSON_URL = 'https://jjyop200816-lang.github.io/hondurastv_juegos/liganacional.json';

    function openAction(target) {
        if (window.Android && typeof window.Android.openStream === 'function') {
            window.Android.openStream(target);
        } else {
            window.location.href = "go:" + target;
        }
    }

    async function cargarPartidos() {
        try {
            const res = await fetch(JSON_URL + '?v=' + Date.now());
            const partidos = await res.json();
            const container = document.getElementById('matchesContainer');
            container.innerHTML = '';
            let ultimaFecha = '';
            
            partidos.forEach(p => {
                if (p.fecha !== ultimaFecha) {
                    const dg = document.createElement('div');
                    dg.className = 'date-group';
                    dg.textContent = p.fecha;
                    container.appendChild(dg);
                    ultimaFecha = p.fecha;
                }
                const card = document.createElement('div');
                card.className = 'card waiting';
                card.setAttribute('data-start', p.start);
                card.setAttribute('data-end', p.end);
                
                let ops = '';
                if (p.opciones) {
                    ops = p.opciones.map(o => `<button onclick="openAction('${o.stream}')" class="play-btn">▶ ${o.nombre.toUpperCase()}</button>`).join('');
                }
                
                card.innerHTML = `<div class='match-info'>
                    <span class='date-time'>${p.hora}</span>
                    <span class='status-badge badge-wait'>PRÓXIMO</span>
                    <span class='status-badge badge-live'>EN VIVO</span>
                    <span class='status-badge badge-ended'>FINALIZADO</span>
                </div>
                <div class='teams'>
                    <div class='team'><span>${p.equipo1}</span></div>
                    <div class='vs-container'><span class='vs'>VS</span></div>
                    <div class='team'><span>${p.equipo2}</span></div>
                </div>
                <div class='actions'>${ops}</div>`;
                container.appendChild(card);
            });
            actualizarEstados();
        } catch(e) {
            document.getElementById('matchesContainer').innerHTML = 'Error al cargar JSON';
        }
    }

    function actualizarEstados() {
        const ahora = Date.now();
        let enVivo = false;
        document.querySelectorAll('.card').forEach(card => {
            const inicio = Date.parse(card.getAttribute('data-start'));
            const fin = Date.parse(card.getAttribute('data-end'));
            if (isNaN(inicio) || isNaN(fin)) return;
            card.classList.remove('active', 'finished', 'is-live', 'waiting');
            if (ahora < inicio) {
                card.classList.add('waiting');
            } else if (ahora >= inicio && ahora <= fin) {
                card.classList.add('active', 'is-live');
                enVivo = true;
            } else {
                card.classList.add('finished');
            }
        });
        const b = document.getElementById('liveBanner');
        if(b) { if(enVivo) b.classList.add('show'); else b.classList.remove('show'); }
    }
    cargarPartidos();
    setInterval(actualizarEstados, 10000);
</script>
</body>
</html>

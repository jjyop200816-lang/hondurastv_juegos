<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solo Player - Direct Stream</title>
    <!-- Librería Clappr Player -->
    <script src="https://cdn.jsdelivr.net/npm/@clappr/player@latest/dist/clappr.min.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }
        #player {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>

    <div id="player"></div>

    <script>
        // Configuración del reproductor limpio
        var player = new Clappr.Player({
            source: "TU_ENLACE_DIRECTO_M3U8_AQUI", // Remplaza esto con la URL .m3u8 que obtengas
            parentId: "#player",
            width: "100%",
            height: "100%",
            autoPlay: true,
            mute: false,
            playback: {
                playInline: true
            }
        });
    </script>

</body>
</html>

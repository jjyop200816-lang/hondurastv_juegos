<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Solo Player</title>
<style>
html, body {
    margin:0;
    padding:0;
    height:100%;
    background:black;
    overflow:hidden;
}

/* contenedor que recorta */
.container {
    position:fixed;
    width:100%;
    height:100%;
    overflow:hidden;
}

/* iframe escalado */
iframe {
    position:absolute;
    top:-100px;   /* reducido para revelar los controles de abajo */
    left:-20px;  
    width:112%;   
    height:125%;  /* ajustado para compensar la altura */
    border:none;
}
</style>
</head>
<body>

<div class="container">
    <iframe 
        src="https://roxiestreams.info/soccer-streams-4"
        sandbox="allow-scripts allow-same-origin allow-forms allow-fullscreen"
        allow="fullscreen"
        allowfullscreen>
    </iframe>
</div>

</body>
</html>

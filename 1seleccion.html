<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selección de Honduras</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #0b1a30; color: #ffffff; padding: 12px; }

        .card { 
            background: #152943; 
            border-radius: 12px; 
            padding: 14px; 
            margin-bottom: 12px; 
            border: 1px solid #233f63;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .header-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .fecha { 
            font-size: 0.85rem; 
            color: #00a8ff; 
            font-weight: bold; 
            text-transform: uppercase;
        }

        .torneo-badge {
            font-size: 0.7rem;
            background: #1e3a5f;
            color: #a0aec0;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 600;
        }

        .estado-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .estado {
            font-size: 0.75rem;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 6px;
        }

        .estado.proximo { background: #1e3a5f; color: #a0aec0; }
        .estado.envivo { background: #e53e3e; color: #ffffff; animation: blink 1.5s infinite; }
        .estado.finalizado { background: #2d3748; color: #718096; }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .timer {
            font-size: 0.8rem;
            color: #f6ad55;
            font-weight: bold;
        }
        
        .equipos { 
            display: flex; 
            justify-content: space-around; 
            align-items: center; 
            font-size: 1.05rem; 
            font-weight: bold; 
            margin-bottom: 8px; 
            padding: 6px 0;
        }

        .equipo {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 42%;
        }

        .equipo.local {
            justify-content: flex-end;
            text-align: right;
        }

        .equipo.visita {
            justify-content: flex-start;
            text-align: left;
        }

        .flag {
            width: 28px;
            height: 20px;
            object-fit: cover;
            border-radius: 3px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .vs { 
            font-size: 0.8rem; 
            color: #7f97b5; 
            background: #0b1a30;
            padding: 3px 10px;
            border-radius: 10px;
        }

        .opciones { 
            display: flex; 
            gap: 8px; 
            flex-wrap: wrap; 
            margin-top: 10px;
            justify-content: center;
        }

        .btn-opt { 
            background: #0084ff; 
            color: #ffffff; 
            border: none; 
            padding: 8px 14px; 
            border-radius: 6px; 
            font-size: 0.85rem; 
            font-weight: bold; 
            cursor: pointer; 
            transition: background 0.2s;
            flex: 1;
            min-width: 100px;
            text-align: center;
        }

        .btn-opt:active { background: #0056b3; }
    </style>
</head>
<body>

    <div id="partidos-container">Cargando partidos...</div>

    <script>
        // Mapeo de banderas de las selecciones
        const banderas = {
            "Honduras": "https://flagcdn.com/w40/hn.png",
            "Surinam": "https://flagcdn.com/w40/sr.png",
            "Jamaica": "https://flagcdn.com/w40/jm.png",
            "Martinica": "https://flagcdn.com/w40/mq.png"
        };

        const partidos = [
          {
            "fecha_txt": "Vie, 25 de Sept | 9:00 p.m.",
            "start": "2026-09-25T21:00:00",
            "equipo1": "Honduras",
            "equipo2": "Surinam",
            "opciones": [
              { "nombre": "Opción 1", "stream": "https://d395pc32ur2dpc.cloudfront.net/out/v1/97d5c45eb4b241db9400b97215ad5531/index.m3u8" },
              { "nombre": "Opción 2", "stream": "https://streaming.onnethn.com/TSI/playlist.m3u8" },
              { "nombre": "Opción 3", "stream": "https://streaming.onnethn.com/DEPORTES_TVC/playlist.m3u8" },
              { "nombre": "Opción 4", "stream": "https://ejemplo.com/live/honduras_surinam_opt4.m3u8" }
            ]
          },
          {
            "fecha_txt": "Lun, 28 de Sept | 8:00 p.m.",
            "start": "2026-09-28T20:00:00",
            "equipo1": "Jamaica",
            "equipo2": "Honduras",
            "opciones": [
              { "nombre": "Opción 1", "stream": "https://ejemplo.com/live/jamaica_honduras.m3u8" },
              { "nombre": "Opción 2", "stream": "https://jjyop200816-lang.github.io/hondurastv_juegos/asiria2.html" },
              { "nombre": "Opción 3", "stream": "https://ejemplo.com/live/jamaica_honduras.mpd" },
              { "nombre": "Opción 4", "stream": "https://ejemplo.com/live/jamaica_honduras_opt4.m3u8" }
            ]
          },
          {
            "fecha_txt": "Vie, 2 de Oct | 8:00 p.m.",
            "start": "2026-10-02T20:00:00",
            "equipo1": "Martinica",
            "equipo2": "Honduras",
            "opciones": [
              { "nombre": "Opción 1", "stream": "https://ejemplo.com/live/martinica_honduras.m3u8" },
              { "nombre": "Opción 2", "stream": "https://jjyop200816-lang.github.io/hondurastv_juegos/asiria3.html" },
              { "nombre": "Opción 3", "stream": "https://ejemplo.com/live/martinica_honduras.mpd" },
              { "nombre": "Opción 4", "stream": "https://ejemplo.com/live/martinica_honduras_opt4.m3u8" }
            ]
          },
          {
            "fecha_txt": "Lun, 5 de Oct | 10:00 p.m.",
            "start": "2026-10-05T22:00:00",
            "equipo1": "Honduras",
            "equipo2": "Jamaica",
            "opciones": [
              { "nombre": "Opción 1", "stream": "https://ejemplo.com/live/honduras_jamaica.m3u8" },
              { "nombre": "Opción 2", "stream": "https://jjyop200816-lang.github.io/hondurastv_juegos/asiria4.html" },
              { "nombre": "Opción 3", "stream": "https://ejemplo.com/live/honduras_jamaica.mpd" },
              { "nombre": "Opción 4", "stream": "https://ejemplo.com/live/honduras_jamaica_opt4.m3u8" }
            ]
          }
        ];

        function actualizarLogica() {
            const container = document.getElementById('partidos-container');
            container.innerHTML = '';
            const ahora = new Date().getTime();

            partidos.forEach((p) => {
                const horaInicio = new Date(p.start).getTime();
                const horaApertura = horaInicio - (30 * 60 * 1000); // 30 minutos antes
                const horaCierre = horaInicio + ((105 + 30) * 60 * 1000); // Duración (105 min) + 30 minutos posteriores

                let estadoHtml = '';
                let timerHtml = '';
                let opcionesContainerHtml = '';
                const titulo = `${p.equipo1} vs ${p.equipo2}`;

                if (ahora < horaApertura) {
                    // Estado: POR JUGAR (No se muestran opciones)
                    const dif = horaApertura - ahora;
                    const horas = Math.floor(dif / (1000 * 60 * 60));
                    const minutos = Math.floor((dif % (1000 * 60 * 60)) / (1000 * 60));
                    const segundos = Math.floor((dif % (1000 * 60)) / 1000);

                    estadoHtml = `<span class="estado proximo">POR JUGAR</span>`;
                    timerHtml = `<div class="timer">Abre en: ${horas}h ${minutos}m ${segundos}s</div>`;
                    opcionesContainerHtml = ''; // Oculto completamente

                } else if (ahora >= horaApertura && ahora <= horaCierre) {
                    // Estado: EN VIVO (Se muestran los botones de streaming)
                    estadoHtml = `<span class="estado envivo">● EN VIVO</span>`;
                    timerHtml = `<div class="timer" style="color:#48bb78;">Transmisión activada</div>`;

                    let botonesHtml = '';
                    p.opciones.forEach(opt => {
                        botonesHtml += `<button class="btn-opt" onclick="abrirOpcion('${opt.stream}', '${titulo}')">${opt.nombre}</button>`;
                    });
                    opcionesContainerHtml = `<div class="opciones">${botonesHtml}</div>`;

                } else {
                    // Estado: FINALIZADO (No se muestran opciones)
                    estadoHtml = `<span class="estado finalizado">FINALIZADO</span>`;
                    timerHtml = `<div class="timer" style="color:#718096;">Partido concluido</div>`;
                    opcionesContainerHtml = ''; // Oculto completamente
                }

                const flag1 = banderas[p.equipo1] || '';
                const flag2 = banderas[p.equipo2] || '';

                const card = `
                    <div class="card">
                        <div class="header-card">
                            <div class="fecha">${p.fecha_txt}</div>
                            <span class="torneo-badge">CONCACAF NATIONS LEAGUE...</span>
                        </div>
                        <div class="estado-container">
                            ${estadoHtml}
                            ${timerHtml}
                        </div>
                        <div class="equipos">
                            <div class="equipo local">
                                <span>${p.equipo1}</span>
                                <img src="${flag1}" alt="${p.equipo1}" class="flag">
                            </div>
                            <span class="vs">VS</span>
                            <div class="equipo visita">
                                <img src="${flag2}" alt="${p.equipo2}" class="flag">
                                <span>${p.equipo2}</span>
                            </div>
                        </div>
                        ${opcionesContainerHtml}
                    </div>
                `;
                container.innerHTML += card;
            });
        }

        function abrirOpcion(url, titulo) {
            if (window.Android && window.Android.openStream) {
                window.Android.openStream(url + '|' + titulo);
            } else {
                window.location.href = url;
            }
        }

        actualizarLogica();
        setInterval(actualizarLogica, 1000);
    </script>
</body>
</html>

        .card { 
            background: #152943;

        }

            font-weight: bold;

            border-radius: 6px;
        }

            color: #e2e8f0; 
        }

        .timer {
            font-size: 0.8rem;
            color: #a0aec0;

        }
        
        .equipos {

            justify-content: space-around; 
            align-items: center; 
            font-size: 1.05rem;

            margin-bottom: 8px;

        }

        .equipo {
            display: flex;
            align-items: center;

            width: 42%;
        }

        .equipo.local {
            justify-content: flex-end;
            text-align: right;
        }

        .equipo.visita {
            justify-content: flex-start;
            text-align: left;
        }

        .flag {
            width: 28px;
            height: 20px;
            object-fit: cover;
            border-radius: 3px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .vs { 
            font-size: 0.8rem; 
            color: #7f97b5; 
            background: #0b1a30;
            padding: 3px 10px;
            border-radius: 10px;
        }

        .opciones { 
            display: flex; 
            gap: 8px; 
            flex-wrap: wrap; 
            margin-top: 10px;
            justify-content: center;
        }

        .btn-opt { 
            background: #2d3748; 
            color: #a0aec0; 
            border: 1px solid #4a5568; 
            padding: 8px 14px; 
            border-radius: 6px; 
            font-size: 0.85rem; 
            font-weight: bold; 
            cursor: not-allowed; 
            flex: 1;
            min-width: 100px;
            text-align: center;
            opacity: 0.6;
        }
    </style>
</head>

    <script>
        const banderas = {
            "Honduras": "https://flagcdn.com/w40/hn.png",
            "Jamaica": "https://flagcdn.com/w40/jm.png"
        };

        // Guardamos el momento exacto en que la página carga
        const horaInicioAbsoluta = Date.now();
        // Definimos la ventana de 4 horas (en milisegundos)
        const duracionActivaMs = 4 * 60 * 60 * 1000; 
        const horaCierreAbsoluta = horaInicioAbsoluta + duracionActivaMs;

        const partidos = [
          {
            "fecha_txt": "EN VIVO AHORA",
            "equipo1": "Honduras",
            "equipo2": "Jamaica",
            "opciones": [
              { "nombre": "Opción 1", "stream": "https://streaming.onnethn.com/DEPORTES_TVC/playlist.m3u8" },
              { "nombre": "Opción 2", "stream": "https://tkx.mp.lura.live/rest/v2/mcp/video/univision-tudn?anvack=NVQrq6a3oZfdBzkefWT1rvdRCoj9XOyx" },
              { "nombre": "Opción 3", "stream": "https://streaming.onnethn.com/TSI/playlist.m3u8" },
              { "nombre": "Opción 4", "stream": "http://ak-47scan.dyndns.tv:25461/live/ATPLUSEN/ysN8PGMW9LPe/491438.m3u8" },
              { "nombre": "Opción 5", "stream": "https://ejemplo.com/live/honduras_jamaica_opt5.m3u8" }
            ]
          }
        ];

        function actualizarLogica() {
            const container = document.getElementById('partidos-container');
            container.innerHTML = '';
            const ahora = Date.now();

            partidos.forEach((p) => {
                let estadoHtml = '';
                let timerHtml = '';
                let opcionesContainerHtml = '';
                const titulo = `${p.equipo1} vs ${p.equipo2}`;

                if (ahora <= horaCierreAbsoluta) {
                    const tiempoRestante = horaCierreAbsoluta - ahora;
                    const horas = Math.floor(tiempoRestante / (1000 * 60 * 60));
                    const minutos = Math.floor((tiempoRestante % (1000 * 60 * 60)) / (1000 * 60));
                    const segundos = Math.floor((tiempoRestante % (1000 * 60)) / 1000);

                    estadoHtml = `<span class="estado envivo">● EN VIVO</span>`;
                    timerHtml = `<div class="timer" style="color:#48bb78;">Transmisión activada (Cierra en ${horas}h ${minutos}m ${segundos}s)</div>`;

                    let botonesHtml = '';
                    p.opciones.forEach(opt => {
                        botonesHtml += `<button class="btn-opt" onclick="abrirOpcion('${opt.stream}', '${titulo}')">${opt.nombre}</button>`;
                    });
                    opcionesContainerHtml = `<div class="opciones">${botonesHtml}</div>`;

                } else {
                    estadoHtml = `<span class="estado finalizado">FINALIZADO</span>`;
                    timerHtml = `<div class="timer" style="color:#718096;">Partido concluido</div>`;
                    opcionesContainerHtml = '';
                }

                const flag1 = banderas[p.equipo1] || '';
                const flag2 = banderas[p.equipo2] || '';

                const card = `
                    <div class="card">
                        <div class="header-card">
                            <div class="fecha">${p.fecha_txt}</div>
                            <span class="torneo-badge">CONCACAF NATIONS LEAGUE</span>
                        </div>
                        <div class="estado-container">
                            ${estadoHtml}
                            ${timerHtml}
                        </div>
                        <div class="equipos">
                            <div class="equipo local">
                                <span>${p.equipo1}</span>
                                <img src="${flag1}" alt="${p.equipo1}" class="flag">
                            </div>
                            <span class="vs">VS</span>
                            <div class="equipo visita">
                                <img src="${flag2}" alt="${p.equipo2}" class="flag">
                                <span>${p.equipo2}</span>
                            </div>
                        </div>
                        ${opcionesContainerHtml}
                    </div>
                `;
                container.innerHTML += card;
            });
        }

        function abrirOpcion(url, titulo) {
            if (window.Android && window.Android.openStream) {
                window.Android.openStream(url + '|' + titulo);
            } else {
                window.location.href = url;
            }
        }

        actualizarLogica();
        setInterval(actualizarLogica, 1000);
    </script>

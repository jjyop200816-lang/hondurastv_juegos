<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selección de Honduras</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #0b1a30; color: #ffffff; padding: 12px; }

        .card { 
            background: #152943; 
            border-radius: 12px; 
            padding: 14px; 
            margin-bottom: 12px; 
            border: 1px solid #233f63;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .header-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .fecha { 
            font-size: 0.85rem; 
            color: #00a8ff; 
            font-weight: bold; 
            text-transform: uppercase;
        }

        .torneo-badge {
            font-size: 0.7rem;
            background: #1e3a5f;
            color: #a0aec0;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 600;
        }

        .estado-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .estado {
            font-size: 0.75rem;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 6px;
        }

        .estado.envivo { background: #e53e3e; color: #ffffff; animation: blink 1.5s infinite; }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .timer {
            font-size: 0.8rem;
            color: #f6ad55;
            font-weight: bold;
        }
        
        .equipos { 
            display: flex; 
            justify-content: space-around; 
            align-items: center; 
            font-size: 1.05rem; 
            font-weight: bold; 
            margin-bottom: 8px; 
            padding: 6px 0;
        }

        .equipo {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 42%;
        }

        .equipo.local {
            justify-content: flex-end;
            text-align: right;
        }

        .equipo.visita {
            justify-content: flex-start;
            text-align: left;
        }

        .flag {
            width: 28px;
            height: 20px;
            object-fit: cover;
            border-radius: 3px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .vs { 
            font-size: 0.8rem; 
            color: #7f97b5; 
            background: #0b1a30;
            padding: 3px 10px;
            border-radius: 10px;
        }

        .opciones { 
            display: flex; 
            gap: 8px; 
            flex-wrap: wrap; 
            margin-top: 10px;
            justify-content: center;
        }

        .btn-opt { 
            background: #0084ff; 
            color: #ffffff; 
            border: none; 
            padding: 8px 14px; 
            border-radius: 6px; 
            font-size: 0.85rem; 
            font-weight: bold; 
            cursor: pointer; 
            transition: background 0.2s;
            flex: 1;
            min-width: 100px;
            text-align: center;
        }

        .btn-opt:active { background: #0056b3; }
    </style>
</head>
<body>

    <div id="partidos-container">Cargando partido...</div>

    <script>
        const banderas = {
            "Honduras": "https://flagcdn.com/w40/hn.png",
            "Jamaica": "https://flagcdn.com/w40/jm.png"
        };

        const partidos = [
          {
            "fecha_txt": "Lun, 5 de Oct | 09:20 p.m.",
            "equipo1": "Honduras",
            "equipo2": "Jamaica",
            "opciones": [
              { "nombre": "Opción 1", "stream": "https://streaming.onnethn.com/DEPORTES_TVC/playlist.m3u8" },
              { "nombre": "Opción 2", "stream": "https://tkx.mp.lura.live/rest/v2/mcp/video/univision-tudn?anvack=NVQrq6a3oZfdBzkefWT1rvdRCoj9XOyx" },
              { "nombre": "Opción 3", "stream": "https://streaming.onnethn.com/TSI/playlist.m3u8" },
              { "nombre": "Opción 4", "stream": "http://ak-47scan.dyndns.tv:25461/live/ATPLUSEN/ysN8PGMW9LPe/491438.m3u8" },
              { "nombre": "Opción 5", "stream": "https://streaming-live-fcdn.api.prd.univisionnow.com/tudn/tudn.isml/hls/tudn.m3u8" }
            ]
          }
        ];

        function cargarPartidos() {
            const container = document.getElementById('partidos-container');
            container.innerHTML = '';

            partidos.forEach((p) => {
                const titulo = `${p.equipo1} vs ${p.equipo2}`;

                const estadoHtml = `<span class="estado envivo">● EN VIVO</span>`;
                const timerHtml = `<div class="timer" style="color:#48bb78;">Transmisión activada</div>`;

                let botonesHtml = '';
                p.opciones.forEach(opt => {
                    botonesHtml += `<button class="btn-opt" onclick="abrirOpcion('${opt.stream}', '${titulo}')">${opt.nombre}</button>`;
                });
                const opcionesContainerHtml = `<div class="opciones">${botonesHtml}</div>`;

                const flag1 = banderas[p.equipo1] || '';
                const flag2 = banderas[p.equipo2] || '';

                const card = `
                    <div class="card">
                        <div class="header-card">
                            <div class="fecha">${p.fecha_txt}</div>
                            <span class="torneo-badge">CONCACAF NATIONS LEAGUE</span>
                        </div>
                        <div class="estado-container">
                            ${estadoHtml}
                            ${timerHtml}
                        </div>
                        <div class="equipos">
                            <div class="equipo local">
                                <span>${p.equipo1}</span>
                                <img src="${flag1}" alt="${p.equipo1}" class="flag">
                            </div>
                            <span class="vs">VS</span>
                            <div class="equipo visita">
                                <img src="${flag2}" alt="${p.equipo2}" class="flag">
                                <span>${p.equipo2}</span>
                            </div>
                        </div>
                        ${opcionesContainerHtml}
                    </div>
                `;
                container.innerHTML += card;
            });
        }

        function abrirOpcion(url, titulo) {
            if (window.Android && window.Android.openStream) {
                window.Android.openStream(url + '|' + titulo);
            } else {
                window.location.href = url;
            }
        }

        cargarPartidos();
    </script>
</body>
</html>

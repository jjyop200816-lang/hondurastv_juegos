<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selección de Honduras</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #0b1a30; color: #ffffff; padding: 12px; }

        .card { 
            background: #152943; 
            border-radius: 12px; 
            padding: 14px; 
            margin-bottom: 12px; 
            border: 1px solid #233f63;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .header-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .fecha { 
            font-size: 0.85rem; 
            color: #00a8ff; 
            font-weight: bold; 
            text-transform: uppercase;
        }

        .estado {
            font-size: 0.75rem;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 6px;
        }

        .estado.proximo { background: #1e3a5f; color: #a0aec0; }
        .estado.envivo { background: #e53e3e; color: #ffffff; animation: blink 1.5s infinite; }
        .estado.finalizado { background: #2d3748; color: #718096; }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .timer {
            font-size: 0.8rem;
            color: #f6ad55;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .equipos { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            font-size: 1.05rem; 
            font-weight: bold; 
            margin-bottom: 14px; 
            padding: 4px 0;
        }

        .vs { 
            font-size: 0.8rem; 
            color: #7f97b5; 
            background: #0b1a30;
            padding: 2px 8px;
            border-radius: 10px;
        }

        .opciones { 
            display: flex; 
            gap: 8px; 
            flex-wrap: wrap; 
        }

        .btn-opt { 
            background: #0084ff; 
            color: #ffffff; 
            border: none; 
            padding: 8px 14px; 
            border-radius: 6px; 
            font-size: 0.85rem; 
            font-weight: bold; 
            cursor: pointer; 
            transition: background 0.2s;
        }

        .btn-opt:active { background: #0056b3; }

        .btn-disabled {
            background: #2d3748;
            color: #718096;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div id="partidos-container">Cargando partidos...</div>

    <script>
        // Configuración de los partidos según las fechas y horas de la imagen
        const partidos = [
          {
            "fecha_txt": "Vie, 25 de Sept | 9:00 p.m.",
            "start": "2026-09-25T21:00:00",
            "equipo1": "Honduras",
            "equipo2": "Surinam",
            "opciones": [
              { "nombre": "Opción 1", "stream": "https://ejemplo.com/live/honduras_surinam.m3u8" },
              { "nombre": "Opción 2", "stream": "https://jjyop200816-lang.github.io/hondurastv_juegos/asiria1.html" },
              { "nombre": "Opción 3", "stream": "https://ejemplo.com/live/honduras_surinam.mpd" }
            ]
          },
          {
            "fecha_txt": "Lun, 28 de Sept | 8:00 p.m.",
            "start": "2026-09-28T20:00:00",
            "equipo1": "Jamaica",
            "equipo2": "Honduras",
            "opciones": [
              { "nombre": "Opción 1", "stream": "https://ejemplo.com/live/jamaica_honduras.m3u8" },
              { "nombre": "Opción 2", "stream": "https://jjyop200816-lang.github.io/hondurastv_juegos/asiria2.html" },
              { "nombre": "Opción 3", "stream": "https://ejemplo.com/live/jamaica_honduras.mpd" }
            ]
          },
          {
            "fecha_txt": "Vie, 2 de Oct | 8:00 p.m.",
            "start": "2026-10-02T20:00:00",
            "equipo1": "Martinica",
            "equipo2": "Honduras",
            "opciones": [
              { "nombre": "Opción 1", "stream": "https://ejemplo.com/live/martinica_honduras.m3u8" },
              { "nombre": "Opción 2", "stream": "https://jjyop200816-lang.github.io/hondurastv_juegos/asiria3.html" },
              { "nombre": "Opción 3", "stream": "https://ejemplo.com/live/martinica_honduras.mpd" }
            ]
          },
          {
            "fecha_txt": "Lun, 5 de Oct | 10:00 p.m.",
            "start": "2026-10-05T22:00:00",
            "equipo1": "Honduras",
            "equipo2": "Jamaica",
            "opciones": [
              { "nombre": "Opción 1", "stream": "https://ejemplo.com/live/honduras_jamaica.m3u8" },
              { "nombre": "Opción 2", "stream": "https://jjyop200816-lang.github.io/hondurastv_juegos/asiria4.html" },
              { "nombre": "Opción 3", "stream": "https://ejemplo.com/live/honduras_jamaica.mpd" }
            ]
          }
        ];

        function actualizarLógica() {
            const container = document.getElementById('partidos-container');
            container.innerHTML = '';
            const ahora = new Date().getTime();

            partidos.forEach((p, index) => {
                const horaInicio = new Date(p.start).getTime();
                const horaApertura = horaInicio - (20 * 60 * 1000); // 20 minutos antes
                const horaCierre = horaInicio + ((105 + 20) * 60 * 1000); // Duración partido (~105 min) + 20 min extra

                let estadoHtml = '';
                let timerHtml = '';
                let botonesHtml = '';
                const titulo = `${p.equipo1} vs ${p.equipo2}`;

                if (ahora < horaApertura) {
                    // Estado: Por jugar / Cuenta regresiva
                    const dif = horaApertura - ahora;
                    const horas = Math.floor(dif / (1000 * 60 * 60));
                    const minutos = Math.floor((dif % (1000 * 60 * 60)) / (1000 * 60));
                    const segundos = Math.floor((dif % (1000 * 60)) / 1000);

                    estadoHtml = `<span class="estado proximo">POR JUGAR</span>`;
                    timerHtml = `<div class="timer">Abre en: ${horas}h ${minutos}m ${segundos}s</div>`;
                    
                    p.opciones.forEach(opt => {
                        botonesHtml += `<button class="btn-opt btn-disabled" disabled>Transmisión no disponible</button>`;
                    });

                } else if (ahora >= horaApertura && ahora <= horaCierre) {
                    // Estado: EN VIVO (Se abre 20 min antes y cierra 20 min después)
                    estadoHtml = `<span class="estado envivo">● EN VIVO</span>`;
                    timerHtml = `<div class="timer" style="color:#48bb78;"> Transmisión activada</div>`;

                    p.opciones.forEach(opt => {
                        botonesHtml += `<button class="btn-opt" onclick="abrirOpcion('${opt.stream}', '${titulo}')">${opt.nombre}</button>`;
                    });

                } else {
                    // Estado: FINALIZADO
                    estadoHtml = `<span class="estado finalizado">FINALIZADO</span>`;
                    timerHtml = `<div class="timer" style="color:#a0aec0;">Partido concluido</div>`;
                    botonesHtml = `<button class="btn-opt btn-disabled" disabled>Partido Finalizado</button>`;
                }

                const card = `
                    <div class="card">
                        <div class="header-card">
                            <div class="fecha">${p.fecha_txt}</div>
                            ${estadoHtml}
                        </div>
                        ${timerHtml}
                        <div class="equipos">
                            <span>${p.equipo1}</span>
                            <span class="vs">VS</span>
                            <span>${p.equipo2}</span>
                        </div>
                        <div class="opciones">${botonesHtml}</div>
                    </div>
                `;
                container.innerHTML += card;
            });
        }

        function abrirOpcion(url, titulo) {
            if (window.Android && window.Android.openStream) {
                window.Android.openStream(url + '|' + titulo);
            } else {
                window.location.href = url;
            }
        }

        // Ejecutar inmediatamente y actualizar la cuenta regresiva cada segundo
        actualizarLógica();
        setInterval(actualizarLógica, 1000);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selección de Honduras</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #0b1a30; color: #ffffff; padding: 12px; }

        .card { 
            background: #152943; 
            border-radius: 12px; 
            padding: 14px; 
            margin-bottom: 12px; 
            border: 1px solid #233f63;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .header-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .fecha { 
            font-size: 0.85rem; 
            color: #00a8ff; 
            font-weight: bold; 
            text-transform: uppercase;
        }

        .torneo-badge {
            font-size: 0.7rem;
            background: #1e3a5f;
            color: #a0aec0;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 600;
        }

        .estado-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .estado {
            font-size: 0.75rem;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 6px;
        }

        .estado.proximo { background: #1e3a5f; color: #a0aec0; }
        .estado.envivo { background: #e53e3e; color: #ffffff; animation: blink 1.5s infinite; }
        .estado.finalizado { background: #2d3748; color: #718096; }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .timer {
            font-size: 0.8rem;
            color: #f6ad55;
            font-weight: bold;
        }
        
        .equipos { 
            display: flex; 
            justify-content: space-around; 
            align-items: center; 
            font-size: 1.05rem; 
            font-weight: bold; 
            margin-bottom: 8px; 
            padding: 6px 0;
        }

        .equipo {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 42%;
        }

        .equipo.local {
            justify-content: flex-end;
            text-align: right;
        }

        .equipo.visita {
            justify-content: flex-start;
            text-align: left;
        }

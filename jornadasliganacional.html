  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    header h1 {
      font-size: 2rem;
      margin-bottom: 15px;
      color: var(--accent);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-bottom: 25px;
    }

    .search-bar {
      width: 100%;
      max-width: 400px;
      padding: 10px 16px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text-main);
      outline: none;
    }

    .filter-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn.active, .filter-btn:hover {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
      font-weight: bold;
    }

    .date-group {
      margin-bottom: 30px;
    }

    .date-title {
      font-size: 1.3rem;
      margin-bottom: 15px;
      padding-bottom: 5px;
      border-bottom: 2px solid var(--accent);
      display: inline-block;
    }

    .events-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 15px;
    }

    .event-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 15px;
      transition: transform 0.2s;
    }

    .event-card:hover {
      transform: translateY(-2px);
    }

    .event-time {
      font-size: 0.85rem;
      color: var(--accent);
      font-weight: bold;
      margin-bottom: 5px;
    }

    .event-title {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .options-btn {
      width: 100%;
      background: var(--border);
      color: var(--text-main);
      border: none;
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
    }

    .channels-list {
      display: none;
      margin-top: 10px;
      grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
      gap: 8px;
    }

    .channel-btn {
      background: #0284c7;
      color: white;
      text-align: center;
      padding: 6px 10px;
      border-radius: 4px;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      border: none;
    }

    .channel-btn:hover {
      background: var(--accent);
      color: black;
    }

    /* Modal / Reproductor con bloqueo de publicidad */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    .modal-content {
      position: relative;
      width: 90%;
      max-width: 900px;
      height: 70vh;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
    }

    .close-btn {
      position: absolute;
      top: -35px;
      right: 0;
      color: white;
      font-size: 24px;
      cursor: pointer;
      font-weight: bold;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>Agenda Deportiva</h1>
    <div class="controls">
      <input type="text" id="search" class="search-bar" placeholder="Buscar evento, equipo o deporte..." onkeyup="filterEvents()">
      <button class="filter-btn active" onclick="filterDay('all')">Todos</button>
      <button class="filter-btn" onclick="filterDay('Thursday')">Jueves 3</button>
      <button class="filter-btn" onclick="filterDay('Friday')">Viernes 4</button>
      <button class="filter-btn" onclick="filterDay('Saturday')">Sábado 5</button>
      <button class="filter-btn" onclick="filterDay('Sunday')">Domingo 6</button>
      <button class="filter-btn" onclick="filterDay('Otros')">Otros</button>
    </div>
  </header>

  <main id="events-container"></main>

    `;

    let parsedEvents = [];

    function parseData() {
      const blocks = rawData.split('------------------------------------------------');
      let currentDay = 'Otros';

      blocks.forEach(block => {
        const lines = block.trim().split('\n').filter(l => l.trim() !== '');
        if (lines.length === 0) return;

        let lineIndex = 0;
        let line = lines[lineIndex];

        // Comprobar si inicia con un día
        const days = ['Thursday', 'Friday', 'Saturday', 'Sunday', 'Monday', 'Tuesday', 'Wednesday'];
        const foundDay = days.find(d => line.startsWith(d));
        
        if (foundDay) {
          currentDay = foundDay;
          // Si la línea contiene el evento después de la fecha
          const dateMatch = line.match(/^([A-Za-z]+,\s\d+\s[A-Za-z]+\s\d{4})\s*(.*)/);
          if (dateMatch && dateMatch[2]) {
            processEventLine(currentDay, dateMatch[2]);
          }
          lineIndex++;
        }

        while (lineIndex < lines.length) {
          processEventLine(currentDay, lines[lineIndex]);
          lineIndex++;
        }
      });
    }

    function processEventLine(day, textLine) {
      if (!textLine.trim()) return;
      
      const timeMatch = textLine.match(/^(\d{2}:\d{2})/);
      const time = timeMatch ? timeMatch[1] : 'TBD';
      
      // Separar links
      const urlRegex = /(https?:\/\/[^\s]+)/g;
      const links = textLine.match(urlRegex) || [];
      
      // Nombre del evento
      let title = textLine.replace(urlRegex, '').replace(/^(\d{2}:\d{2})/, '').trim();

      if (title) {
        parsedEvents.push({
          day: day,
          time: time,
          title: title,
          links: links
        });
      }
    }

    function renderEvents(eventsToRender) {
      const container = document.getElementById('events-container');
      container.innerHTML = '';

      if (eventsToRender.length === 0) {
        container.innerHTML = '<p style="text-align:center; color: var(--text-muted);">No se encontraron eventos.</p>';
        return;
      }

      // Agrupar por días
      const grouped = {};
      eventsToRender.forEach(ev => {
        if (!grouped[ev.day]) grouped[ev.day] = [];
        grouped[ev.day].push(ev);
      });

      for (const [day, events] of Object.entries(grouped)) {
        const daySection = document.createElement('div');
        daySection.className = 'date-group';
        
        let dayTitleHTML = `<h2 class="date-title">${translateDay(day)}</h2>`;
        let gridHTML = `<div class="events-grid">`;

        events.forEach((ev, index) => {
          let optionsHTML = '';
          if (ev.links.length > 0) {
            optionsHTML = `
              <button class="options-btn" onclick="toggleChannels('chan-${day}-${index}')">
                Opciones (${ev.links.length})
              </button>
              <div id="chan-${day}-${index}" class="channels-list">
                ${ev.links.map((link, i) => `<button class="channel-btn" onclick="openPlayer('${link}')">Opción ${i + 1}</button>`).join('')}
              </div>
            `;
          } else {
            optionsHTML = `<p style="font-size:0.8rem; color:var(--text-muted); text-align:center;">Sin enlaces disponibles</p>`;
          }

          gridHTML += `
            <div class="event-card">
              <div class="event-time">⏰ ${ev.time}</div>
              <div class="event-title">${ev.title}</div>
              ${optionsHTML}
            </div>
          `;
        });

        gridHTML += `</div>`;
        daySection.innerHTML = dayTitleHTML + gridHTML;
        container.appendChild(daySection);
      }
    }

    function translateDay(day) {
      const map = {
        'Thursday': 'Jueves 3 de Septiembre',
        'Friday': 'Viernes 4 de Septiembre',
        'Saturday': 'Sábado 5 de Septiembre',
        'Sunday': 'Domingo 6 de Septiembre',
        'Monday': 'Lunes 7 de Septiembre',
        'Tuesday': 'Martes 8 de Septiembre',
        'Wednesday': 'Miércoles 9 de Septiembre',
        'Otros': 'Próximos Eventos'
      };
      return map[day] || day;
    }

    function toggleChannels(id) {
      const el = document.getElementById(id);
      el.style.display = (el.style.display === 'grid') ? 'none' : 'grid';
    }

    function filterDay(day) {
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      if (day === 'all') {
        renderEvents(parsedEvents);
      } else {
        const filtered = parsedEvents.filter(e => e.day === day);
        renderEvents(filtered);
      }
    }

    function filterEvents() {
      const query = document.getElementById('search').value.toLowerCase();
      const filtered = parsedEvents.filter(e => e.title.toLowerCase().includes(query));
      renderEvents(filtered);
    }

    function openPlayer(url) {
      const modal = document.getElementById('playerModal');
      const iframe = document.getElementById('videoPlayer');
      iframe.src = url;
      modal.style.display = 'flex';
    }

    function closePlayer() {
      const modal = document.getElementById('playerModal');
      const iframe = document.getElementById('videoPlayer');
      iframe.src = '';
      modal.style.display = 'none';
    }

    // Inicializar
    parseData();
    renderEvents(parsedEvents);
  </script>

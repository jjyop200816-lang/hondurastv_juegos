<div id="video-container" style="position: relative; width: 100vw; height: 100vh; background: #000; margin: 0; padding: 0; overflow: hidden;">
    <iframe id="mi-video" src="https://cdn.tdtcloud.xyz/embed.php?id=caracolhd2" style="width: 100%; height: 100%; border: none;" frameborder="0" scrolling="no" allow="autoplay; picture-in-picture; fullscreen" allowfullscreen></iframe>
    
    <!-- Botón minimalista flotante (solo icono, sin letras) -->
    <button onclick="toggleFullScreen()" style="position: absolute; bottom: 20px; right: 20px; z-index: 9999; background: rgba(0,0,0,0.6); color: #fff; border: none; border-radius: 50%; width: 45px; height: 45px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 20px;" title="Pantalla Completa">
        🖥️
    </button>
</div>

<script>
function toggleFullScreen() {
    var elem = document.getElementById("video-container");
    if (!document.fullscreenElement) {
        if (elem.requestFullscreen) {
            elem.requestFullscreen();
        } else if (elem.webkitRequestFullscreen) { /* Safari */
            elem.webkitRequestFullscreen();
        } else if (elem.msRequestFullscreen) { /* IE11 */
            elem.msRequestFullscreen();
        }
    } else {
        if (document.exitFullscreen) {
            document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
            document.webkitExitFullscreen();
        } else if (document.msExitFullscreen) {
            document.msExitFullscreen();
        }
    }
}
</script>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Solo Player</title>
<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: black;
    overflow: hidden;
}

/* Contenedor que ajusta la vista al marco de la pantalla */
.container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
}

/* iframe ajustado para centrar la transmisión en la pantalla vertical */
iframe {
    position: absolute;
    top: -35%;     /* Sube un poco la vista para centrar el video verticalmente */
    left: -10%;    /* Centra la transmisión horizontalmente */
    width: 170%;   /* Escala óptima para cubrir el ancho de la pantalla */
    height: 170%;  /* Escala óptima de alto */
    border: none;
}
</style>
</head>
<body>
<div class="container">
    <iframe 
        src="https://roxiestreams.info/soccer-streams-6"
        sandbox="allow-scripts allow-same-origin allow-forms"
        allowfullscreen>
    </iframe>
</div>
</body>
</html>

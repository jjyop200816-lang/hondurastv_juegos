<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Solo Player</title>
<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: black;
    overflow: hidden;
}

/* Contenedor principal que ocupa toda la pantalla */
.container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
}

/* iframe con menos zoom y alineado hacia la izquierda */
iframe {
    position: absolute;
    top: -18%;     /* Ajuste vertical para centrar el video */
    left: -18%;    /* Mueve la vista hacia la izquierda para quitar la barra lateral */
    width: 135%;   /* Zoom reducido horizontalmente */
    height: 135%;  /* Zoom reducido verticalmente */
    border: none;
}
</style>
</head>
<body>
<div class="container">
    <iframe 
        src="https://roxiestreams.info/soccer-streams-7"
        sandbox="allow-scripts allow-same-origin allow-forms"
        allowfullscreen>
    </iframe>
</div>
</body>
</html>
